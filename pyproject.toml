[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-recommender"
version = "0.1.0"
description = "FlipAttire fashion recommendation and experimentation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "polars>=1.20,<2",
    "pyarrow>=18,<23",
    "scipy>=1.13,<2",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx2>=2,<3"]
production = ["confluent-kafka>=2.8,<3"]
spark = ["pyspark>=4.0,<5"]
ui = ["streamlit>=1.57,<2"]

[tool.setuptools.packages.find]
where = ["src"]
