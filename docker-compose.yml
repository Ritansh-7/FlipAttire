services:
  recommender-api:
    build: .
    ports: ["8000:8000"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HM_MODEL_VERSION: hm_spark_v1
      HM_ARTICLES_PARQUET: /data/articles.parquet
      HM_POPULARITY_PARQUET: /models/hm_spark_v1.popularity.parquet
      HM_AFFINITY_PARQUET: /models/hm_spark_v1.customer_top_affinity.parquet
      HM_SIMILARITY_PARQUET: /models/hm_spark_v1.item_similarity.parquet
    volumes:
      - ./data/bronze:/data:ro
      - ./models/artifacts:/models:ro
    depends_on: [kafka]

  kafka:
    image: apache/kafka:4.0.1
    hostname: kafka
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["event-streaming-ui"]
    ports: ["8080:8080"]
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: hm-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  postgres:
    image: postgres:17
    profiles: ["data-services"]
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: hm
      POSTGRES_PASSWORD: hm
      POSTGRES_DB: hm
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    profiles: ["data-services"]
    ports: ["8123:8123", "9000:9000"]
    volumes: ["clickhouse-data:/var/lib/clickhouse"]

  redis:
    image: redis:7.4-alpine
    profiles: ["data-services"]
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:v1.13.6
    profiles: ["data-services"]
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    profiles: ["data-services"]
    command: server /data --console-address ":9001"
    ports: ["9001:9001", "9002:9000"]
    environment:
      MINIO_ROOT_USER: hmadmin
      MINIO_ROOT_PASSWORD: hmadmin123
    volumes: ["minio-data:/data"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    profiles: ["data-services"]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlartifacts"]

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: hmadmin
    volumes:
      - "grafana-data:/var/lib/grafana"
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  clickhouse-data:
  qdrant-data:
  minio-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
